version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gentstyle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gentstyle_user
      POSTGRES_PASSWORD: gentstyle_secret
      POSTGRES_DB: gentstyle_db
    ports:
      - "5432:5432"
    volumes:
      - gentstyle_pgdata:/var/lib/postgresql/data
    networks:
      - gentstyle-network

  redis:
    image: redis:7-alpine
    container_name: gentstyle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - gentstyle-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gentstyle-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://gentstyle_user:gentstyle_secret@postgres:5432/gentstyle_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "super_secret_jwt_access_key_change_in_production_987654321"
      JWT_REFRESH_SECRET: "super_secret_jwt_refresh_key_change_in_production_123456789"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - gentstyle-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: gentstyle-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gentstyle-network

volumes:
  gentstyle_pgdata:

networks:
  gentstyle-network:
    driver: bridge
